<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zenith — Testador de Avatares</title>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<style>
  :root { --bg:#0d0d12; --panel:#17171f; --line:#2a2a36; --text:#e8e8ef; --muted:#8b8b9a; --accent:#8346c6; --accent2:#b17ddf; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  .wrap { display:flex; gap:24px; padding:24px; flex-wrap:wrap; align-items:flex-start; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:20px; }
  .controls { width:360px; }
  h1 { font-size:18px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:12px; margin:0 0 20px; }
  label { display:block; font-size:13px; margin:16px 0 6px; color:var(--muted); }
  .row { display:flex; align-items:center; gap:10px; }
  input[type=range] { flex:1; accent-color:var(--accent); }
  .val { width:64px; text-align:right; font-variant-numeric:tabular-nums; font-weight:600; }
  .result { margin-top:22px; padding:16px; background:#101017; border:1px solid var(--line); border-radius:10px; }
  .pickid { font-size:22px; font-weight:700; color:var(--accent2); letter-spacing:.5px; }
  .reason { font-size:12px; color:var(--muted); line-height:1.7; margin-top:8px; }
  .reason b { color:var(--text); font-weight:600; }
  .badge { display:inline-block; font-size:11px; padding:2px 8px; border-radius:99px; margin-left:8px; vertical-align:middle; }
  .badge.ok { background:#1f3d29; color:#6ee7a0; }
  .badge.no { background:#3d2029; color:#f0a; }
  .viewer { width:320px; }
  model-viewer { width:300px; height:400px; background:#0d0d12; border-radius:12px; border:1px solid var(--line); }
  .quick { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .quick button, .opt button { background:#20202b; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:12px; cursor:pointer; }
  .quick button:hover, .opt button:hover { border-color:var(--accent); }
  .quick button.active { background:var(--accent); border-color:var(--accent); }
  .opt { display:flex; gap:8px; margin-top:12px; align-items:center; font-size:12px; color:var(--muted); flex-wrap:wrap; }
  .missing { font-size:12px; color:#f0a; margin-top:8px; min-height:16px; }
  .fallback-note { color:#e0b055; }
</style>
</head>
<body>
<div class="wrap">
  <div class="panel controls">
    <h1>Testador de Avatares Zenith</h1>
    <p class="sub">Sliders → qual avatar o app escolhe (lógica do ARCHETYPES.md). Os botões vêm do <code>library.json</code>, ordenados por <b>IMC medido</b> — clique em sequência para ver a escada de corpos (é o teste de continuidade do QA).</p>

    <label>Peso <span class="val" id="pesoV">75 kg</span></label>
    <div class="row"><input type="range" id="peso" min="40" max="180" step="0.5" value="75"></div>

    <label>Altura <span class="val" id="alturaV">175 cm</span></label>
    <div class="row"><input type="range" id="altura" min="150" max="205" step="1" value="175"></div>

    <label>% Gordura corporal <span class="val" id="gorduraV">18%</span></label>
    <div class="row"><input type="range" id="gordura" min="4" max="45" step="0.5" value="18"></div>

    <div class="result">
      <div><span class="pickid" id="pickId">—</span><span class="badge" id="existBadge"></span></div>
      <div class="reason" id="reason"></div>
      <div class="missing" id="missing"></div>
    </div>
  </div>

  <div class="viewer">
    <div class="panel" style="padding:12px; display:inline-block;">
      <!-- environment-image: a identidade Zenith (rim roxo + azul frio) mora
           AQUI, nao no GLB. glTF nao transporta iluminacao de forma portavel;
           o model-viewer ilumina por IBL. Gerado por scripts/make_env.py.
           skybox-image fica de fora de proposito: queremos a LUZ, nao o fundo.
           tone-mapping neutral para nao dessaturar o roxo do rim. -->
      <model-viewer id="mv" auto-rotate rotation-per-second="30deg" interaction-prompt="none"
                    disable-zoom camera-orbit="0deg 90deg auto" exposure="1" shadow-intensity="0"
                    environment-image="../03_dist/env/zenith_env.hdr"
                    tone-mapping="neutral"></model-viewer>
      <div class="sub" id="count" style="margin:10px 0 4px">carregando library.json…</div>
      <div class="quick" id="quick"></div>
      <div class="opt">
        <span>Card:</span>
        <button data-w="300" data-h="400" class="active">300px (app)</button>
        <button data-w="500" data-h="640">500px (inspeção)</button>
        <span style="margin-left:8px">|</span>
        <label style="margin:0"><input type="checkbox" id="orbit"> girar com mouse</label>
      </div>
      <div class="opt">
        <span>Fundo:</span>
        <button data-bg="#0d0d12" class="active">escuro</button>
        <button data-bg="#e9e9ee">claro</button>
        <button data-bg="#8346c6">roxo</button>
      </div>
    </div>
  </div>
</div>

<script>
// ---- selecao de avatar: schema 3 (ARCHETYPES.md §5) ----
//
// ATE 27/07 ESTE ARQUIVO SIMULAVA A REGRA ERRADA. Ele montava o id colando
// faixa nominal + definicao ("zen_m_" + b07 + "_d2") e usava a tabela BANDS de
// 12 faixas de IMC. Isso e a logica anterior ao schema 3, revogada em 26/07
// quando o metrics.py mostrou que o corpo produzido nao corresponde a faixa
// que o NOME promete (o zen_m_b12_d1 foi pedido para IMC >= 38 e o corpo tem
// IMC 147). Consequencias de ter ficado para tras:
//
//   - os 9 avatares de insercao eram INALCANCAVEIS pelos sliders: nenhuma
//     combinacao de peso/altura/gordura gera um id com sufixo h/i/j/k/m;
//   - a correcao de altura nao existia (ver abaixo), entao o testador dava um
//     resultado que o app nao vai dar.
//
// Agora vale a regra do indice: DEFINICAO pelo % de gordura, e dentro dela o
// avatar de menor |measured_bmi - IMC_alvo|. Nao existe mais "combinacao
// inexistente" - sempre ha um mais proximo.
//
// ⚠️ ESCALA UNIFORME NAO PRESERVA IMC. Ao escalar por s, o volume vai com s³ e
// a altura com s², entao o IMC representado vai com s. O mesmo avatar exibido
// para alguem de 1,90 m representa ~8,6% mais IMC do que para alguem de
// 1,75 m. Sem a correcao o app entrega corpo sistematicamente errado nos
// extremos de altura. A formula viaja no proprio indice, em
// selection.target_bmi_formula.
const DEF_LABEL = {d1:"Baixa",d2:"Média",d3:"Alta"};
// Avatares que existem, preenchido a partir do library.json no fim do arquivo.
// Era uma lista mantida A MAO e ja tinha apodrecido: o comentario dizia "36
// masters" enquanto listava 39. Duplicar o indice aqui nao paga.
// Sufixo h/i/j/k/m = INSERCAO num vao de cobertura; marca a intencao, nao a
// posicao (quem ordena e o measured_bmi).
const AVAILABLE = new Set();
let LIB = null;          // library.json, carregado no fim do arquivo

function defFor(g, thr){ if(g < thr.d3_below) return "d3"; if(g < thr.d2_below) return "d2"; return "d1"; }

function classify(peso, alturaCm, gordura){
  const altura = alturaCm/100;
  const imc = peso/(altura*altura);
  const imcAlvo = imc * (LIB.reference_height_m / altura);
  const sel = LIB.selection;
  const def0 = defFor(gordura, sel.definition_thresholds_bodyfat_pct.m);

  // Fallback de definicao: so entra se a LINHA INTEIRA estiver vazia (hoje,
  // so o feminino). Ordem vem do indice, nao hardcoded.
  const ordem = sel.definition_fallback;
  const steps = [];
  let def = def0, candidatos = [];
  for(let d = ordem.indexOf(def0); d < ordem.length; d++){
    def = ordem[d];
    candidatos = LIB.avatars.filter(a => a.sex === "m" && a.definition === def);
    if(candidatos.length) break;
    steps.push(def);
  }
  if(!candidatos.length){
    return {imc, imcAlvo, def0, def:null, id:LIB.default.m, fallback:true, steps, escolhido:null};
  }
  const escolhido = candidatos.reduce((melhor,a) =>
    Math.abs(a.measured_bmi-imcAlvo) < Math.abs(melhor.measured_bmi-imcAlvo) ? a : melhor);
  return {imc, imcAlvo, def0, def, id:escolhido.id,
          fallback:def!==def0, steps, escolhido};
}

const mv=document.getElementById("mv");
// O seletor de resolucao saiu em 27/07: o LOD foi decidido em 60k e passou a
// valer para os 39. Os GLBs de comparacao em test/compare/ existiam so para
// b02_d3 e b11_d1, ficaram para tras no restyle e apareciam ROXOS ao lado dos
// demais. Toda a biblioteca vem de 03_dist/glb/ agora.
let curId="zen_m_b05_d2";

function srcFor(id){
  return "../03_dist/glb/"+id+"_v1.glb?t="+Date.now();
}
function setAvatar(id){
  curId=id;
  document.querySelectorAll("#quick button").forEach(b=>b.classList.toggle("active", b.dataset.id===id));
  const miss=document.getElementById("missing");
  if(AVAILABLE.has(id)){
    mv.src=srcFor(id); mv.style.display="block";
    miss.innerHTML="";
  } else {
    // Com a selecao por measured_bmi isto nao deveria acontecer: todo id vem
    // do proprio library.json. Se aparecer, o indice esta apontando para um
    // GLB que nao existe em 03_dist/glb/.
    mv.removeAttribute("src"); mv.style.display="block";
    miss.textContent="asset "+id+" está no library.json mas não existe em 03_dist/glb/";
  }
}

function update(){
  const peso=+peso_.value, altura=+altura_.value, gordura=+gordura_.value;
  pesoV.textContent=peso.toFixed(1).replace(/\.0$/,"")+" kg";
  alturaV.textContent=altura+" cm";
  gorduraV.textContent=gordura.toFixed(1).replace(/\.0$/,"")+"%";
  const r=classify(peso,altura,gordura);
  pickId.textContent=r.id;
  const exists=AVAILABLE.has(r.id);
  const badge=document.getElementById("existBadge");
  badge.className="badge "+(exists?"ok":"no");
  badge.textContent=exists?"existe":"não produzido";

  const corrigido = Math.abs(r.imcAlvo-r.imc) >= 0.05;
  let reason=`IMC <b>${r.imc.toFixed(1)}</b>`;
  reason += corrigido
    ? ` → corrigido para a altura: <b>${r.imcAlvo.toFixed(1)}</b> `+
      `<span style="opacity:.65">(×${(LIB.reference_height_m/(altura/100)).toFixed(3)}, escala uniforme não preserva IMC)</span>`
    : ` <span style="opacity:.65">(altura de referência, sem correção)</span>`;
  reason += `<br>%gordura <b>${gordura}%</b> → definição <b>${r.def0}</b> (${DEF_LABEL[r.def0]})`;
  if(r.escolhido){
    const d = Math.abs(r.escolhido.measured_bmi-r.imcAlvo);
    reason += `<br>mais próximo na linha <b>${r.def}</b>: IMC medido <b>${r.escolhido.measured_bmi}</b>`+
      ` <span style="opacity:.65">(distância ${d.toFixed(1)})</span> · ${r.escolhido.label}`;
    if(d > 2.5) reason += `<br><span class="fallback-note">⚠ vizinho a ${d.toFixed(1)} de IMC — vão de cobertura nesta região</span>`;
  }
  if(r.fallback) reason+=`<br><span class="fallback-note">fallback de definição: ${r.steps.join(" → ")} sem avatares, usou ${r.def||"o default do índice"}</span>`;
  document.getElementById("reason").innerHTML=reason;
  setAvatar(r.id);
}

const peso_=document.getElementById("peso"), altura_=document.getElementById("altura"), gordura_=document.getElementById("gordura");
[peso_,altura_,gordura_].forEach(s=>s.addEventListener("input",update));

// Botoes de avatar, lidos do library.json.
//
// ANTES eles eram gerados por lacos da grade nominal (b01..b12), e por isso
// os 9 avatares de INSERCAO (sufixo h/i/j/k/m) nunca ganhavam botao: a
// biblioteca tinha 39 e o testador mostrava 30. Sumiam justamente os mais
// caros de produzir, os que fecharam vaos de cobertura.
//
// A ordem e por measured_bmi, nao pelo nome do arquivo. E o que o
// ARCHETYPES.md §4 exige: o sufixo de insercao marca a INTENCAO, nao a
// posicao, entao ordenar por nome embaralha a escada de corpos e destroi o
// teste de continuidade do QA.
//
// Precisa de http (localhost) por causa do fetch - file:// nao serve, o que
// ja valia para carregar os GLBs.
const quick=document.getElementById("quick");

fetch("../library.json?t="+Date.now()).then(r=>r.json()).then(lib=>{
  LIB = lib;
  const avatares=[...lib.avatars].sort((a,b)=>a.measured_bmi-b.measured_bmi);
  for(const a of avatares){
    AVAILABLE.add(a.id);
    const b=document.createElement("button");
    b.textContent=a.id.replace("zen_m_","")+" · "+a.measured_bmi.toFixed(1);
    b.dataset.id=a.id;
    b.title=`${a.definition} · IMC ${a.measured_bmi} · ${a.label} · cintura/altura ${a.waist_to_height}`;
    b.onclick=()=>setAvatar(a.id);
    quick.appendChild(b);
  }
  document.getElementById("count").textContent=
    avatares.length+" avatares · ordenados por IMC medido";
  update();   // so agora AVAILABLE existe
}).catch(err=>{
  document.getElementById("missing").innerHTML=
    "<span class='fallback-note'>não consegui ler library.json ("+err+"). "+
    "Abra por http (localhost), não por file://.</span>";
});

// opções de card / fundo / orbit
document.querySelectorAll(".opt button[data-w]").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".opt button[data-w]").forEach(x=>x.classList.remove("active"));
  b.classList.add("active"); mv.style.width=b.dataset.w+"px"; mv.style.height=b.dataset.h+"px";
});
document.querySelectorAll(".opt button[data-bg]").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".opt button[data-bg]").forEach(x=>x.classList.remove("active"));
  b.classList.add("active"); mv.style.background=b.dataset.bg;
});
document.getElementById("orbit").addEventListener("change",e=>{
  if(e.target.checked) mv.setAttribute("camera-controls",""); else mv.removeAttribute("camera-controls");
});

// update() e chamado pelo fetch acima, quando AVAILABLE ja estiver preenchido.
</script>
</body>
</html>
