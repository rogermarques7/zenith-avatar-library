<!DOCTYPE html>
<meta charset="utf-8">
<title>Zenith - sonda de morph no three.js</title>
<!--
  Sonda de RENDERIZADOR, nao de malha. Ela responde tres perguntas que o
  Blender nao responde e que so aparecem no device:

    1. os 9 morph targets chegam? (o caminho legado do three.js para em 8; com
       WebGL2 ele usa textura de morph e passa disso - mas isso e afirmacao, e
       afirmacao se confere)
    2. as DUAS primitivas (corpo e short) morfam? cada uma vira um THREE.Mesh
       com o SEU proprio morphTargetInfluences
    3. influence NEGATIVA funciona? no Blender o slider trava em 0..1 e o
       estado "tudo no minimo" renderiza igual a base - foi assim que uma foto
       aprovou um morph que nao tinha sido aplicado

  Serve por http (localhost), nunca file://.
-->
<style>
  body { margin:0; background:#0d0d12; color:#d8dae0;
         font:13px ui-monospace,monospace; display:flex; }
  #cv { flex:1; height:100vh; }
  #lado { width:340px; padding:12px; overflow:auto; height:100vh; box-sizing:border-box; }
  #log { white-space:pre-wrap; line-height:1.5; }
  .lin { margin:6px 0; }
  input[type=range] { width:170px; vertical-align:middle; }
  b { color:#b9a7ff; }
</style>
<canvas id="cv"></canvas>
<div id="lado"><div id="log">carregando...</div><div id="ctrl"></div></div>
<!-- Sem o import map a pagina fica em "carregando..." SEM erro no console: os
     loaders de examples/jsm importam `from "three"`, que e especificador nu, e
     o grafo de modulos inteiro falha calado. -->
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";
import { RGBELoader } from "three/addons/loaders/RGBELoader.js";

const GLB = new URLSearchParams(location.search).get("glb")
          || "../03_dist/glb/zen_m_b05h_d2_v4.glb";
const log = document.getElementById("log");
const cv = document.getElementById("cv");

const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
renderer.setPixelRatio(devicePixelRatio);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0d12);
const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
cam.position.set(0, 0.95, 4.2);
cam.lookAt(0, 0.95, 0);

function resize() {
  const w = cv.clientWidth, h = cv.clientHeight;
  renderer.setSize(w, h, false);
  cam.aspect = w / h; cam.updateProjectionMatrix();
}
addEventListener("resize", resize);

// O HDR de producao: sem ele o corpo sai cinza (metade do visual mora fora do
// GLB, CLAUDE.md regra 4).
new RGBELoader().load("../03_dist/env/zenith_env.hdr", (t) => {
  t.mapping = THREE.EquirectangularReflectionMapping;
  scene.environment = t;
});

const draco = new DRACOLoader();
draco.setDecoderPath("https://www.gstatic.com/draco/versioned/decoders/1.5.6/");
const loader = new GLTFLoader();
loader.setDRACOLoader(draco);

const alvos = [];   // [{mesh}]
let nomes = [];

loader.load(GLB, (gltf) => {
  scene.add(gltf.scene);
  const linhas = [];
  linhas.push("WebGL" + (renderer.capabilities.isWebGL2 ? "2" : "1")
              + " | maxTextures " + renderer.capabilities.maxTextures);
  gltf.scene.traverse((o) => {
    if (!o.isMesh) return;
    const d = o.morphTargetDictionary, inf = o.morphTargetInfluences;
    linhas.push("mesh <b>" + (o.name || "?") + "</b> mat=" + o.material.name
                + " verts=" + o.geometry.attributes.position.count
                + " targets=" + (inf ? inf.length : 0));
    if (inf) { alvos.push(o); nomes = Object.keys(d); }
  });
  linhas.push("targetNames: " + nomes.join(", "));
  linhas.push("primitivas com morph: <b>" + alvos.length + "</b>");
  log.innerHTML = linhas.join("\n");
  montarControles();
  resize();
  let girar = true;
  // Gancho para inspecao automatizada: comparar duas fotos so vale com o corpo
  // PARADO, senao a diferenca medida e a rotacao.
  window.__zen = {
    set, nomes, alvos,
    parar: () => { girar = false; gltf.scene.rotation.y = 0; },
    lidas: () => alvos.map((m) => Array.from(m.morphTargetInfluences)),
    // Mede a SILHUETA renderizada: a unica prova de que a GPU aplicou a
    // influence. Ler o array de influences so prova que o JS aceitou o numero.
    silhueta: () => {
      renderer.render(scene, cam);
      const gl = renderer.getContext();
      const w = gl.drawingBufferWidth, h = gl.drawingBufferHeight;
      const px = new Uint8Array(w * h * 4);
      gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
      let x0 = w, x1 = -1, y0 = h, y1 = -1, n = 0;
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        const i = (y * w + x) * 4;
        if (px[i] > 40 || px[i + 1] > 40 || px[i + 2] > 46) {
          n++; if (x < x0) x0 = x; if (x > x1) x1 = x;
          if (y < y0) y0 = y; if (y > y1) y1 = y;
        }
      }
      return { largura: x1 - x0, altura: y1 - y0, pixels: n };
    },
  };
  renderer.setAnimationLoop(() => {
    if (girar) gltf.scene.rotation.y += 0.004;
    renderer.render(scene, cam);
  });
}, undefined, (e) => { log.textContent = "FALHOU: " + e; });

function set(nome, v) {
  // ⚠️ em TODAS as primitivas, nao so na primeira - senao o short fica parado
  for (const m of alvos) m.morphTargetInfluences[m.morphTargetDictionary[nome]] = v;
}

function montarControles() {
  const c = document.getElementById("ctrl");
  for (const n of nomes) {
    const d = document.createElement("div"); d.className = "lin";
    const s = document.createElement("input");
    s.type = "range"; s.min = -1; s.max = 1; s.step = 0.05; s.value = 0;
    const t = document.createElement("span"); t.textContent = " 0.00 " + n;
    s.oninput = () => { set(n, +s.value); t.textContent = " " + (+s.value).toFixed(2) + " " + n; };
    d.append(s, t); c.append(d);
  }
  const b = document.createElement("button");
  b.textContent = "tudo -1 / 0 / +1";
  let est = 0;
  b.onclick = () => {
    est = (est + 1) % 3;
    const v = [-1, 0, 1][est];
    for (const n of nomes) set(n, v);
    for (const s of c.querySelectorAll("input")) { s.value = v; s.dispatchEvent(new Event("input")); }
  };
  c.append(b);
}
</script>
